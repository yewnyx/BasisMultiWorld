# One line per world:  <slug>  <UDP port>  <bundle>  <display name>
#
# - The first line is the hub. Keep it on 4296: players who type only your domain, and clients
#   that get no SRV answer, connect to port 4296.
# - <slug> becomes <slug>.<DNS_ZONE> and the folder worlds/<slug>/. Lowercase letters, digits, dashes.
# - <bundle> is appended to CDN_BASE from .env, or is a full https:// URL.
# - <display name> is what server lists and portal prompts show. The rest of the line, spaces allowed.
#
# After editing: ./configure.sh && sudo docker compose up -d

hub      4296   Hub.BEE       My Hub
forest   4297   Forest.BEE    Forest Walk
city     4298   City.BEE      City at Night
